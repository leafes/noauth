      "colima": {
        "pkg-path": "colima",
        "version": "0.8.1"
      },
      "docker": {
        "pkg-path": "docker",
        "version": "27"
      },
      "nodejs": {
        "pkg-path": "nodejs"
      }
    },
    "hook": {
      "on-activate": "  # Write to nixos config \n  docker build . -t my-app:test-build-000\n  # Show SHA hash\n  docker images --no-trunc\n"
    },
    "profile": {},
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-darwin",
        "x86_64-linux"
      ],
      "allow": {
        "licenses": []
      },
      "semver": {}
    },
    "services": {
      "colima": {
        "command": "colima start",
        "is-daemon": true,
        "shutdown": {
          "command": "colima stop"
        }
      }
    },
    "containerize": {
      "config": {
        "user": "root:docker"
      }
    }
  },
